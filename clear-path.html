<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clear Path NYC — a free guide for families of children with disabilities</title>
<meta name="description" content="A free step-by-step guide for New York City families of children with any disability: what to do next, who to call, the deadlines the city has to meet, and letters you can send. English and Spanish.">
<link rel="canonical" href="https://kirtonlearning.com/clear-path">
<meta property="og:type" content="website">
<meta property="og:title" content="Clear Path NYC — what to do next, who to call">
<meta property="og:description" content="A free step-by-step guide for NYC families of children with any disability. Nothing to sign up for; nothing you type leaves your phone.">
<meta property="og:url" content="https://kirtonlearning.com/clear-path">
<meta property="og:image" content="https://kirtonlearning.com/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/atkinson-hyperlegible-400-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/fonts/atkinson.css">
<style>
/* The claude.ai wrapper used to supply this. Without it every tab panel shows at once,
   because .view sets display:flex and that beats the hidden attribute. */
[hidden]:not([hidden=until-found i]) { display: none !important; }
img { max-width: 100%; }
body { margin: 0; }
/* Layout: a single calm column. Pick your starting point, get a numbered path, then a filterable directory and a glossary. */
:root {
  --bg: #f3f6f8;
  --surface: #ffffff;
  --ink: #141d2e;
  --navy: #141d2e;        /* Kirton Learning brand */
  --on-navy: #eef2f8;
  --on-navy-muted: #a9b6cb;
  --muted: #546a76;
  --line: #d6e0e6;
  --accent: #1f6f8b;        /* harbor blue */
  --accent-soft: #e1eff4;
  --sun: #f2b632;           /* the one warm signal */
  --sun-ink: #5a3d00;
  --done: #2f7d5b;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1c23; --surface: #162730; --ink: #e6eef2; --muted: #9db2bd; --line: #284049;
    --accent: #6cc0dc; --accent-soft: #1b3742; --sun: #f2b632; --sun-ink: #2a1c00; --done: #6fcf9f;
    --navy: #0b111c; --on-navy: #eef2f8; --on-navy-muted: #8e9bb2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1c23; --surface: #162730; --ink: #e6eef2; --muted: #9db2bd; --line: #284049;
  --accent: #6cc0dc; --accent-soft: #1b3742; --sun: #f2b632; --sun-ink: #2a1c00; --done: #6fcf9f;
  --navy: #0b111c; --on-navy: #eef2f8; --on-navy-muted: #8e9bb2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 44px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h2 { font-size: 1.6rem; font-weight: 800; }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 6px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--navy); }
.appbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy); color: var(--on-navy);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.appbar-in { max-width: 760px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 12px 4px; flex-wrap: wrap; }
.appbar .brand { color: var(--on-navy); text-decoration: none; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; letter-spacing: .08em; }
.appbar .brand .kl { color: var(--sun); }
.appbar .brand .sep { color: var(--on-navy-muted); }
.appbar .lang { background: transparent; border-color: rgba(255,255,255,.22); }
.appbar .lang button { color: var(--on-navy); }
.appbar .lang button[aria-pressed="true"] { background: var(--on-navy); color: var(--navy); }
.tabs { max-width: 760px; margin: 0 auto; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  font: inherit; font-family: var(--font-display); font-weight: 700; font-size: .98rem; white-space: nowrap; cursor: pointer;
  background: transparent; color: var(--on-navy-muted); border: 0; border-bottom: 3px solid transparent; padding: 12px 14px 10px;
}
.tab:hover { color: var(--on-navy); }
.tab[aria-selected="true"] { color: var(--on-navy); border-bottom-color: var(--sun); }
.tab:first-child { padding-left: 0; }
.subtabs { display: flex; flex-wrap: wrap; gap: 8px; }
.view { display: flex; flex-direction: column; gap: 44px; }
.view > section:first-child, .view > .hero:first-child { padding-top: 28px; }
.view[data-view="tools"] { gap: 28px; }
.hero { display: flex; flex-direction: column; gap: 14px; }
.promo { background: var(--accent-soft); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }
.promo b { font-family: var(--font-display); }
footer a { color: inherit; }
.lang .short { display: none; }
@media (max-width: 520px) {
  .lang .long { display: none; } .lang .short { display: inline; }
  .appbar-in { flex-wrap: nowrap; }
  .appbar .brand { font-size: .7rem; gap: 6px; }
  .tab { padding: 12px 10px 10px; font-size: .94rem; }
}
.brand { font-family: var(--font-display); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .78rem; color: var(--accent); }
.hero h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 800; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--sun) 62%); padding: 0 .1em; }
.hero .lede { color: var(--muted); max-width: 60ch; font-size: 1.08rem; }
.callnow { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; font-size: .95rem; }
.callnow strong { font-family: var(--font-display); }

section { display: flex; flex-direction: column; gap: 18px; }
.kicker { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* Starting point picker */
.picker { display: flex; flex-direction: column; gap: 18px; }
.qgroup { display: flex; flex-direction: column; gap: 10px; }
.qgroup > span { font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: .95rem; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 9px 16px; border-radius: 999px; transition: border-color .15s, background .15s;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }

/* Path */
.progress { display: flex; align-items: center; gap: 12px; font-size: .95rem; color: var(--muted); }
.bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--done); transition: width .3s; }
ol.path { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; counter-reset: step; }
ol.path li { position: relative; padding: 0 0 26px 54px; counter-increment: step; }
ol.path li::before {
  content: counter(step); position: absolute; left: 0; top: 0;
  width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 800;
  background: var(--surface); border: 2px solid var(--accent); color: var(--accent);
}
ol.path li::after { content: ""; position: absolute; left: 17px; top: 40px; bottom: 4px; width: 2px; background: var(--line); }
ol.path li:last-child::after { display: none; }
ol.path li.is-done::before { content: "✓"; background: var(--done); border-color: var(--done); color: var(--surface); }
ol.path li.is-done h3 { color: var(--muted); }
.step { display: flex; flex-direction: column; gap: 8px; }
.step .when { font-size: .82rem; font-weight: 700; color: var(--sun-ink); background: var(--sun); align-self: flex-start; padding: 2px 10px; border-radius: 6px; }
.step p { color: var(--ink); max-width: 62ch; }
.step ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; }
.step .who { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.step .who a { font-size: .88rem; text-decoration: none; background: var(--accent-soft); padding: 4px 10px; border-radius: 6px; }
.donebox { display: flex; gap: 8px; align-items: center; font-size: .92rem; color: var(--muted); cursor: pointer; margin-top: 4px; }
.donebox input { width: 18px; height: 18px; accent-color: var(--done); }

/* Directory */
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.dir { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card .cat { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
.card p { color: var(--muted); font-size: .95rem; }
.contact { display: flex; flex-direction: column; gap: 6px; margin-top: auto; padding-top: 6px; }
.line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.line .num { font-weight: 700; user-select: all; }
.line .lab { font-size: .82rem; color: var(--muted); }
.copy { font: inherit; font-size: .8rem; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 6px; padding: 2px 8px; }
.copy:hover { border-color: var(--accent); }
.hours { font-size: .85rem; color: var(--muted); }
.flag { font-size: .85rem; background: var(--accent-soft); border-radius: 8px; padding: 6px 10px; color: var(--ink); }

/* Glossary */
dl.gloss { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 10px 18px; }
dl.gloss dt { font-family: var(--font-display); font-weight: 800; color: var(--accent); }
dl.gloss dd { margin: 0; min-width: 0; }
@media (max-width: 480px) { dl.gloss { grid-template-columns: 1fr; gap: 2px; } dl.gloss dd { margin-bottom: 10px; } }

footer { font-size: .88rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 18px; display: flex; flex-direction: column; gap: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Additions: language switch, section nav, letter writer, call log */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.lang { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.lang button { font: inherit; font-size: .85rem; border: 0; background: transparent; color: var(--ink); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 700; }
nav.jump { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .95rem; }
nav.jump a { text-decoration: none; font-weight: 700; }
nav.jump a:hover { text-decoration: underline; }
.writeit { font: inherit; font-size: .88rem; cursor: pointer; align-self: flex-start; border: 1.5px solid var(--accent); color: var(--accent); background: transparent; border-radius: 6px; padding: 4px 12px; font-weight: 700; }
.writeit:hover { background: var(--accent-soft); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: .88rem; font-weight: 700; }
.field input, .field select, .field textarea {
  font: inherit; font-size: 1rem; color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%;
}
.field textarea { min-height: 90px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); outline: none; }
.check { display: flex; gap: 8px; align-items: center; font-size: .95rem; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.letter-out { white-space: pre-wrap; font-family: var(--font-body); font-size: .98rem; background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; padding: 18px; margin: 0; overflow-wrap: anywhere; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { font: inherit; font-weight: 700; cursor: pointer; border: 0; background: var(--accent); color: var(--surface); border-radius: 8px; padding: 9px 18px; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.tip { font-size: .9rem; color: var(--muted); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.log li { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); }
.log .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.log .who { font-weight: 700; }
.log .next { font-size: .92rem; }
.log .del { align-self: flex-start; font: inherit; font-size: .8rem; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px; padding: 2px 8px; }
.log .del.confirm { border-color: #b3261e; color: #b3261e; }
.empty { color: var(--muted); font-size: .95rem; border: 1px dashed var(--line); border-radius: 10px; padding: 16px; }
.boro-note { font-size: .85rem; color: var(--muted); }
.copyplan { align-self: flex-start; }
.prep-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.checks .check { align-items: flex-start; }
.checks .check input { margin-top: 4px; flex: none; }
.tl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.tl li { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: baseline; }
.tl .days { font-family: var(--font-display); font-weight: 800; color: var(--accent); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.tl .days small { display: block; font-family: var(--font-body); font-weight: 400; font-size: .74rem; color: var(--muted); letter-spacing: .02em; }
.rights { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.rights li { display: flex; flex-direction: column; gap: 2px; padding-left: 14px; border-left: 3px solid var(--sun); }
.rights b { font-family: var(--font-display); }
.calc-out { display: flex; flex-direction: column; gap: 6px; font-variant-numeric: tabular-nums; }
.calc-out .due { font-size: 1.05rem; }
.calc-out .due b { color: var(--accent); }
</style>
</head>
<body>

<header class="appbar">
  <div class="appbar-in">
    <a class="brand" href="/"><span class="kl">Kirton Learning</span><span class="sep">/</span><span>Clear Path NYC</span></a>
    <div class="lang" role="group" aria-label="Language / Idioma">
      <button id="lang-en" data-lang="en" aria-pressed="true" aria-label="English"><span class="long">English</span><span class="short">EN</span></button>
      <button id="lang-es" data-lang="es" aria-pressed="false" aria-label="Español"><span class="long">Español</span><span class="short">ES</span></button>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="tab-plan" data-view="plan" data-t="tabPlan"></button>
    <button class="tab" role="tab" id="tab-help" data-view="help" data-t="tabHelp"></button>
    <button class="tab" role="tab" id="tab-tools" data-view="tools" data-t="tabTools"></button>
    <button class="tab" role="tab" id="tab-rights" data-view="rights" data-t="tabRights"></button>
    <button class="tab" role="tab" id="tab-words" data-view="words" data-t="tabWords"></button>
  </nav>
</header>

<div class="wrap">
  <main>
  <div class="view" data-view="plan" role="tabpanel" aria-labelledby="tab-plan">
    <div class="hero">
      <h1 data-th="h1"></h1>
      <p class="lede" data-t="lede"></p>
      <p class="flag" id="es-draft" hidden>Esta traducción al español es un borrador y todavía no la ha revisado un hablante nativo. La versión en inglés es la oficial. Si algo no está claro, cambie a English arriba o llame a la línea de INCLUDEnyc.</p>
      <div class="callnow"><strong data-t="stuck"></strong><span data-th="stuckBody"></span></div>
    </div>
  <section aria-labelledby="start-h">
    <div class="kicker" data-t="kStart"></div>
    <h2 id="start-h" data-t="hStart"></h2>
    <div class="picker" id="picker"></div>
  </section>

  <section aria-labelledby="path-h">
    <div class="kicker" data-t="kPath"></div>
    <h2 id="path-h" data-t="hPath"></h2>
    <p id="path-sub" style="color:var(--muted)"></p>
    <div class="progress"><span id="prog-text"></span><div class="bar"><i id="prog-bar"></i></div></div>
    <ol class="path" id="path"></ol>
    <div class="row"><button class="btn ghost copyplan" id="copy-plan" data-t="copyPlan"></button><span class="tip" data-t="copyPlanTip"></span></div>
  </section>
  </div>

  <div class="view" data-view="help" role="tabpanel" aria-labelledby="tab-help" hidden>
  <section aria-labelledby="dir-h">
    <div class="kicker" data-t="kDir"></div>
    <h2 id="dir-h" data-t="hDir"></h2>
    <p class="boro-note" id="boro-note"></p>
    <div class="filters" id="filters"></div>
    <div class="dir" id="dir"></div>
  </section>
  </div>

  <div class="view" data-view="tools" role="tabpanel" aria-labelledby="tab-tools" hidden>
    <section style="padding-top:28px">
      <div class="kicker" data-t="kTools"></div>
      <div class="subtabs" id="subtabs">
        <button class="chip" id="sub-letters" data-sub="letters" data-t="navLetter"></button>
        <button class="chip" id="sub-prep" data-sub="prep" data-t="navPrep"></button>
        <button class="chip" id="sub-child" data-sub="child" data-t="navProfile"></button>
        <button class="chip" id="sub-log" data-sub="log" data-t="navLog"></button>
      </div>
    </section>
  <section class="subview" data-sub="letters" aria-labelledby="letter-h">
    <div class="kicker" data-t="kLetter"></div>
    <h2 id="letter-h" data-t="hLetter"></h2>
    <p style="color:var(--muted)" data-t="letterIntro"></p>
    <div class="panel">
      <div class="form">
        <div class="field wide"><label for="lt-type" data-t="lType"></label><select id="lt-type"></select></div>
        <div class="field"><label for="lt-parent" data-t="lParent"></label><input id="lt-parent" autocomplete="name"></div>
        <div class="field"><label for="lt-contact" data-t="lContact"></label><input id="lt-contact"></div>
        <div class="field"><label for="lt-child" data-t="lChild"></label><input id="lt-child"></div>
        <div class="field"><label for="lt-dob" data-t="lDob"></label><input id="lt-dob" type="date"></div>
        <div class="field"><label for="lt-school" id="lt-school-label" data-t="lSchool"></label><input id="lt-school"></div>
        <div class="field"><label for="lt-grade" data-t="lGrade"></label><input id="lt-grade"></div>
        <div class="field"><label for="lt-to" data-t="lTo"></label><input id="lt-to"></div>
        <div class="field"><label for="lt-lang" data-t="lLang"></label><input id="lt-lang"></div>
        <div class="field wide"><label for="lt-concerns" id="lt-concerns-label" data-t="lConcerns"></label><textarea id="lt-concerns"></textarea></div>
        <label class="check field wide" id="lt-ei-wrap"><input type="checkbox" id="lt-ei"> <span data-t="lEi"></span></label>
      </div>
      <pre class="letter-out" id="lt-out" aria-live="polite"></pre>
      <div class="row">
        <button class="btn" id="lt-copy" data-t="copyLetter"></button>
        <span class="tip" data-t="letterTip"></span>
      </div>
    </div>
  </section>
  <section class="subview" data-sub="prep" aria-labelledby="prep-h">
    <div class="kicker" data-t="kPrep"></div>
    <h2 id="prep-h" data-t="hPrep"></h2>
    <p style="color:var(--muted)" data-t="prepIntro"></p>
    <div class="prep-grid" id="prep"></div>
    <div class="row"><button class="btn ghost" id="prep-copy" data-t="prepCopy"></button></div>

  sehot: { cat: "school", name: ["NYC Special Education Hotline", "Línea de Educación Especial de NYC"], desc: ["The school system's citywide line for special education questions, including finding your Committee on Special Education. District 75 runs specialized programs for students with significant disabilities.", "La línea de toda la ciudad para preguntas de educación especial, incluso para encontrar su Comité de Educación Especial. El Distrito 75 tiene programas especializados para estudiantes con discapacidades importantes."], lines: [["(718) 935-2007", ["Special Education Hotline", "Línea de Educación Especial"]], ["(212) 802-1500", ["District 75", "Distrito 75"]]], hours: ["Hotline: Mon–Fri, 9 AM–5 PM", "Línea: lun–vie, 9 AM–5 PM"], extra: "SpecialEducation@schools.nyc.gov", url: "https://www.schools.nyc.gov/learning/special-education/help/committees-on-special-education" },
  s504: { cat: "school", name: ["504 accommodations", "Adaptaciones 504"], desc: ["For students who don't need special instruction but do need changes to take part in school: extra time, medication at school, elevator access, a seat near the board. Ask the school's 504 coordinator for the request form.", "Para estudiantes que no necesitan enseñanza especial pero sí cambios para participar en la escuela: más tiempo, medicamentos en la escuela, uso del ascensor, un asiento cerca de la pizarra. Pida el formulario al coordinador 504 de la escuela."], lines: [], url: "https://www.schools.nyc.gov/school-life/health-and-wellness/504-accommodations" },
  sensory: { cat: "school", name: ["School vision and hearing services", "Servicios escolares de visión y audición"], desc: ["NYC Public Schools has Education Vision Services for blind and low vision students and Hearing Education Services for deaf and hard of hearing students. Vision services are for ages 5–21 and need a report from an eye doctor. Ask for them in the IEP.", "Las Escuelas Públicas de NYC tienen servicios de visión para estudiantes ciegos o con baja visión, y servicios de audición para estudiantes sordos o con pérdida auditiva. Los servicios de visión son para edades de 5 a 21 años y requieren un informe de un oftalmólogo. Pídalos en el IEP."], lines: [["311", ["From outside NYC: 212-639-9675", "Desde fuera de NYC: 212-639-9675"]]], url: "https://portal.311.nyc.gov/article/?kanumber=KA-02442" },
  bus: { cat: "move", name: ["School bus (Office of Pupil Transportation)", "Autobús escolar (Oficina de Transporte Estudiantil)"], desc: ["Special busing is a service written into the IEP, along with needs like a lift, air conditioning, a smaller bus or a time limit on the ride. Bus details post in your NYC Schools Account before school starts. For problems, start with the school's transportation coordinator, then call OPT the same day.", "El autobús especial es un servicio que se escribe en el IEP, junto con necesidades como un elevador, aire acondicionado, un autobús más pequeño o un límite de tiempo en el viaje. Los detalles salen en su cuenta NYC Schools Account antes de que empiecen las clases. Si hay problemas, hable primero con el coordinador de transporte de la escuela y luego llame a OPT el mismo día."], lines: [["(718) 392-8855", ["OPT", "OPT"]]], url: "https://includenyc.org/help-center/resources/school-busing/" },
  aar: { cat: "move", name: ["Access-A-Ride and Reduced-Fare MetroCard/OMNY", "Access-A-Ride y tarjeta de tarifa reducida"], desc: ["Access-A-Ride is shared door-to-door rides, 24/7, for people whose disability keeps them from using buses and subways. Reduced-Fare cards cut subway and bus fares in half for people with a qualifying disability. Apply through the MTA and ask how the rules apply to your child.", "Access-A-Ride ofrece viajes compartidos de puerta a puerta, las 24 horas, para personas cuya discapacidad les impide usar autobuses y el metro. Las tarjetas de tarifa reducida cobran la mitad en metro y autobús a personas con una discapacidad que califique. Solicítelo con la MTA y pregunte cómo aplican las reglas para su hijo."], lines: [["(877) 337-2017", ["Access-A-Ride", "Access-A-Ride"]], ["(877) 789-6669", ["Reduced-Fare OMNY", "OMNY de tarifa reducida"]], ["511", ["Reduced-Fare MetroCard: say “MTA”", "MetroCard de tarifa reducida: diga “MTA”"]]], url: "https://www.nyc.gov/site/mopd/resources/transportation.page" },
  opwdd: { cat: "dis", name: "OPWDD Front Door", desc: ["New York State's office for people with developmental disabilities, including autism, intellectual disability, cerebral palsy, epilepsy and neurological impairment. Opens services like respite, after-school and family supports.", "La oficina del Estado de Nueva York para personas con discapacidades del desarrollo, incluidos el autismo, la discapacidad intelectual, la parálisis cerebral, la epilepsia y el daño neurológico. Abre servicios como respiro, programas después de la escuela y apoyo familiar."],
    lines: [["(866) 946-9733", ["OPWDD InfoLine: ask for the Front Door for your borough", "Línea de OPWDD: pida el Front Door de su condado"]]], url: "https://opwdd.ny.gov/get-started/front-door" },
  cco: { cat: "dis", name: ["Care Coordination Organizations", "Organizaciones de Coordinación de Cuidado (CCO)"], desc: ["Once OPWDD says your child is eligible, a care manager from one of these organizations builds the plan and connects services. You choose, and you can switch.", "Cuando OPWDD dice que su hijo es elegible, un administrador de cuidado de una de estas organizaciones hace el plan y conecta los servicios. Usted escoge, y puede cambiar."], lines: [["(833) 692-2269", "Advance Care Alliance"], ["(518) 235-1888", "Care Design NY"], ["(844) 504-8400", "Tri-County Care"]], flag: ["Ask whether they are taking new enrollments before you sign up.", "Pregunte si están aceptando inscripciones nuevas antes de inscribirse."], url: "https://includenyc.org/help-center/resources/care-coordination-organization/" },
  fss: { cat: "fam", name: ["OPWDD Family Support Services", "Servicios de Apoyo Familiar de OPWDD"], desc: ["For families caring for a child with a developmental disability at home. Can include respite, recreation and camp, after-school programs, behavior support, parent and sibling groups, special equipment, home changes and family reimbursement. Your child needs OPWDD eligibility; Medicaid isn't required.", "Para familias que cuidan en casa a un niño con una discapacidad del desarrollo. Puede incluir respiro, recreación y campamento, programas después de la escuela, apoyo de conducta, grupos para padres y hermanos, equipo especial, cambios en la casa y reembolso familiar. Su hijo necesita ser elegible para OPWDD; no se requiere Medicaid."], lines: [["(866) 946-9733", ["OPWDD InfoLine", "Línea de información de OPWDD"]]], url: "https://opwdd.ny.gov/family-resources" },
  cyes: { cat: "fam", name: ["Children's Waiver (C-YES)", "Exención para Niños (C-YES)"], desc: ["A Medicaid program for kids under 21 with high needs: serious mental health needs, medically fragile, or a developmental disability along with being medically fragile or in foster care. It pays for supports at home and in the community, including respite. If your child has no Medicaid, C-YES checks eligibility and helps you apply. If they have Medicaid, ask a Health Home.", "Un programa de Medicaid para menores de 21 años con muchas necesidades: necesidades graves de salud mental, médicamente frágiles, o con una discapacidad del desarrollo junto con ser médicamente frágiles o estar en cuidado de crianza. Paga apoyos en la casa y en la comunidad, incluido el respiro. Si su hijo no tiene Medicaid, C-YES revisa si califica y le ayuda a solicitarlo. Si ya tiene Medicaid, pregunte a un Health Home."], lines: [["(833) 861-4467", ["C-YES, toll-free", "C-YES, gratis"]]], url: "https://www.health.ny.gov/health_care/medicaid/redesign/behavioral_health/children/c-yes.htm" },
  chp: { cat: "money", name: ["Child Health Plus and children's Medicaid", "Child Health Plus y Medicaid para niños"], desc: ["Every child in New York 18 and under can get health insurance, whatever the family's income or immigration status. Child Health Plus has no copays. Most families pay $0 to $60 a month per child, depending on income; families earning more than four times the poverty level pay the plan's full premium. Families with lower incomes may get Medicaid instead. Apply through NY State of Health.", "Todo niño en Nueva York de 18 años o menos puede tener seguro médico, sin importar el ingreso de la familia ni el estatus migratorio. Child Health Plus no tiene copagos. La mayoría de las familias paga de $0 a $60 al mes por niño, según el ingreso; las familias que ganan más de cuatro veces el nivel de pobreza pagan la prima completa del plan. Las familias de menores ingresos pueden recibir Medicaid. Solicítelo con NY State of Health."], lines: [["(855) 355-5777", ["NY State of Health", "NY State of Health"]], ["(877) 898-5849", ["TTY", "TTY"]]], url: "https://access.nyc.gov/programs/child-health-plus" },
  ssi: { cat: "money", name: ["SSI for children", "SSI para niños"], desc: ["A monthly payment from Social Security for children with a disability that seriously limits daily life for at least 12 months. Part of the parents' income counts, so many working families still qualify.", "Un pago mensual del Seguro Social para niños con una discapacidad que limita mucho su vida diaria por al menos 12 meses. Se cuenta solo una parte del ingreso de los padres, así que muchas familias que trabajan califican."], lines: [["(800) 772-1213", ["Social Security", "Seguro Social"]]], url: "https://www.ssa.gov/ssi/text-child-ussi.htm" },
  aba: { cat: "therapy", name: ["ABA and therapy through insurance", "ABA y terapias con su seguro"], desc: ["NY Medicaid covers ABA therapy for children under 21 with an autism diagnosis, and private plans regulated by New York must cover it too. Call the member number on your child's insurance card and ask for in-network providers.", "Medicaid de NY cubre la terapia ABA para menores de 21 años con diagnóstico de autismo, y los planes privados regulados por Nueva York también deben cubrirla. Llame al número de servicios para miembros en la tarjeta del seguro de su hijo y pida proveedores dentro de la red."], lines: [[["Number on the back of the card", "Número al reverso de la tarjeta"], ["Member services", "Servicios para miembros"]]], flag: ["Some ABA providers have stopped taking new Medicaid patients after 2025–26 rate cuts. Call several and get on more than one waitlist.", "Algunos proveedores de ABA dejaron de aceptar pacientes nuevos de Medicaid tras los recortes de 2025–26. Llame a varios y anótese en más de una lista de espera."], url: "https://advocatesforchildren.org/wp-content/uploads/library/guide_to_autism_spectrum_disorders_and_ed.pdf" },
  mh: { cat: "mh", name: ["Child mental health in NYC", "Salud mental infantil en NYC"], desc: ["988 gives free, confidential crisis counseling and referrals 24/7 by call, text or chat. The city's child mental health page lists clinics, Family Resource Centers for families of kids with emotional or behavioral challenges, and the referral system for intensive services.", "El 988 ofrece consejería de crisis gratis y confidencial y referidos, las 24 horas, por llamada, texto o chat. La página de salud mental infantil de la ciudad tiene clínicas, Centros de Recursos Familiares para familias de niños con retos emocionales o de conducta, y el sistema de referidos para servicios intensivos."], lines: [["988", ["Call or text, 24/7", "Llame o envíe texto, 24/7"]]], url: "https://www.nyc.gov/site/doh/health/health-topics/child-and-adolescent-mental-health-info-referrals.page" },
  parks: { cat: "fun", name: ["NYC Parks adaptive programs", "Programas adaptados de NYC Parks"], desc: ["Adaptive Hubs are fully accessible recreation centers. There's adaptive swim. A recreation center membership for people with disabilities is $25 a year and covers every Parks center. Programs are geared to physical disabilities; ask about ages.", "Los Adaptive Hubs son centros recreativos totalmente accesibles. Hay natación adaptada. La membresía de centros recreativos para personas con discapacidad cuesta $25 al año y sirve en todos los centros de Parks. Los programas son para discapacidades físicas; pregunte por las edades."], lines: [], url: "https://www.nycgovparks.org/events/adaptive-programs" },
  sony: { cat: "fun", name: ["Special Olympics New York", "Olimpiadas Especiales de Nueva York"], desc: ["Free sports training and competition. Young Athletes is for children up to age 7 of all abilities. From age 8, athletes with an intellectual disability or cognitive delay can join one of 22 sports through a training club near you.", "Entrenamiento y competencias deportivas gratis. Young Athletes es para niños de hasta 7 años de todas las habilidades. Desde los 8 años, atletas con discapacidad intelectual o retraso cognitivo pueden unirse a uno de 22 deportes en un club cerca de usted."], lines: [], url: "https://www.specialolympics-ny.org/nycregion" },
  camps: { cat: "fun", name: ["Camps and the INCLUDEnyc Fair", "Campamentos y la Feria de INCLUDEnyc"], desc: ["INCLUDEnyc has a guide to choosing a camp and runs the city's largest resource fair for camps, recreation and programs for young people with disabilities. If your child is OPWDD eligible, ask your care manager about camp funds or family reimbursement.", "INCLUDEnyc tiene una guía para escoger campamento y organiza la feria de recursos más grande de la ciudad con campamentos, recreación y programas para jóvenes con discapacidad. Si su hijo es elegible para OPWDD, pregunte a su administrador de cuidado por fondos para campamento o reembolso familiar."], lines: [], url: "https://includenyc.org/help-center/resources/selecting-a-summer-camp/" },
  housing: { cat: "home", name: ["NYC Housing Connect", "NYC Housing Connect (vivienda asequible)"], desc: ["In city affordable housing lotteries, 5% of units are set aside for people with mobility disabilities and 2% for vision or hearing disabilities. Make a Housing Connect profile to get alerts, and have a doctor fill out HPD's medical form for set-aside units.", "En las loterías de vivienda asequible de la ciudad, el 5% de las unidades se reservan para personas con discapacidad de movilidad y el 2% para discapacidad visual o auditiva. Cree un perfil en Housing Connect para recibir avisos, y pida a un médico que llene el formulario médico de HPD para las unidades reservadas."], lines: [["(212) 863-7990", ["Application status", "Estado de la solicitud"]]], url: "https://www.nyc.gov/site/hpd/services-and-information/resources-for-people-with-disabilities.page" },
  ilc: { cat: "dis", name: ["Independent living center", "Centro de vida independiente"], desc: ["Run by and for people with disabilities. Help with benefits, housing, advocacy and life skills for teens and adults.", "Dirigido por y para personas con discapacidad. Ayuda con beneficios, vivienda, defensa de derechos y destrezas para la vida, para adolescentes y adultos."],
    lines: () => ({ bx: [["(718) 515-2800", "Bronx Independent Living Services"]], bk: [["(718) 998-3000", "Brooklyn Center for Independence of the Disabled"]], mn: [["(212) 674-2300", "Manhattan Center for Independence of the Disabled"], ["(212) 222-7122", "Harlem Independent Living Center"]], qn: [["(646) 442-1520", "Queens Center for Independence of the Disabled"]], si: [["(718) 720-9016", "Staten Island Center for Independent Living"]] }[state.boro]), url: "https://includenyc.org/help-center/resources/independent-living-centers/" },
  afc: { cat: "legal", name: "Advocates for Children of NY", desc: ["Free education advice and legal help for low-income families in all five boroughs, including when a school says no or services aren't happening.", "Consejos de educación y ayuda legal gratis para familias de bajos ingresos en los cinco condados, incluso cuando la escuela dice que no o los servicios no se están dando."], lines: [["(866) 427-6033", ["Education Helpline", "Línea de educación"]]], hours: ["Mon–Thu, 10 AM–4 PM", "Lun–jue, 10 AM–4 PM"], url: "https://advocatesforchildren.org/" },
  p2p: { cat: "parent", name: ["Parent to Parent of NYS", "Parent to Parent de NYS"], desc: ["Matches you one-on-one with a trained parent whose child has a similar disability or health need. You don't have to figure this out alone.", "Le conecta uno a uno con un padre o madre capacitado cuyo hijo tiene una discapacidad o necesidad de salud parecida. No tiene que resolver esto solo."], lines: [["(212) 741-5545", ["NYC office", "Oficina de NYC"]]], url: "https://www.ptopnys.org/about-us/regional-office/" }
};

const DEV = ["autism", "dd"];
const STEPS = [
  { id: "binder", show: () => true, when: ["Today", "Hoy"], t: ["Start a folder for every paper", "Empiece una carpeta para todos los papeles"],
    p: ["You will be asked for the same reports again and again. Keep one folder or binder with:", "Le van a pedir los mismos informes una y otra vez. Guarde en una carpeta:"],
    list: [["Every evaluation, diagnosis and medical report", "Cada evaluación, diagnóstico e informe médico"], ["A copy of every letter you send, with the date", "Una copia de cada carta que envíe, con la fecha"], ["Notes from every call. The call log on this page helps", "Notas de cada llamada. El registro de llamadas de esta página le ayuda"]], who: ["includenyc"] },

  { id: "cyshcn", show: () => true, when: ["This week", "Esta semana"], t: ["Get a free city navigator", "Consiga un orientador gratis de la ciudad"],
    p: ["Call NYC's Children & Youth with Special Health Care Needs program. They help families of kids with any disability or chronic condition find services, and they'll help even before there's a diagnosis. Immigration status doesn't matter.", "Llame al programa de Niños y Jóvenes con Necesidades Especiales de Salud de NYC. Ayudan a familias de niños con cualquier discapacidad o condición crónica a encontrar servicios, incluso antes de un diagnóstico. El estatus migratorio no importa."], who: ["cyshcn"] },

  { id: "insure", show: () => true, when: ["If your child isn't covered", "Si su hijo no tiene seguro"], t: ["Make sure your child has health insurance", "Asegúrese de que su hijo tenga seguro médico"],
    p: ["Evaluations, therapy and many services go through insurance. Every New York child 18 and under can get coverage, regardless of income or immigration status. Call NY State of Health and ask about Child Health Plus.", "Las evaluaciones, terapias y muchos servicios pasan por el seguro. Todo niño de Nueva York de 18 años o menos puede tener cobertura, sin importar el ingreso ni el estatus migratorio. Llame a NY State of Health y pregunte por Child Health Plus."], who: ["chp"] },

  { id: "ei", show: s => s.age === "baby", when: ["This week", "Esta semana"], t: ["Call 311 and ask for Early Intervention", "Llame al 311 y pida Intervención Temprana"],
    p: ["You don't need a diagnosis or a doctor's note. Say: “I'm worried about my child's development and want an Early Intervention evaluation.” The evaluation and services are free. A service coordinator will call you back and explain each step.", "No necesita diagnóstico ni nota del médico. Diga: “Me preocupa el desarrollo de mi hijo y quiero una evaluación de Intervención Temprana (Early Intervention).” La evaluación y los servicios son gratis. Un coordinador de servicios le llamará y le explicará cada paso."], who: ["ei", "includenyc"] },

  { id: "dx-older", show: s => s.age !== "baby" && s.dx === "no", when: ["This week", "Esta semana"], t: ["Ask the pediatrician for an evaluation referral", "Pida al pediatra un referido para evaluación"],
    p: ["Tell the doctor exactly what you're seeing and ask who should evaluate it.", "Dígale al médico exactamente lo que está notando y pregunte quién debe evaluarlo."],
    list: [["Development, learning or autism: a developmental-behavioral pediatrician, neurologist or psychologist", "Desarrollo, aprendizaje o autismo: un pediatra del desarrollo, neurólogo o psicólogo"], ["Mood, behavior or anxiety: a child psychiatrist, psychologist or mental health clinic", "Estado de ánimo, conducta o ansiedad: un psiquiatra infantil, psicólogo o clínica de salud mental"], ["Hearing or vision: an audiologist or pediatric eye doctor", "Audición o visión: un audiólogo u oftalmólogo pediátrico"], ["Waitlists can be long. Call as soon as you have the referral and ask for a cancellation list", "Las listas de espera pueden ser largas. Llame en cuanto tenga el referido y pida estar en la lista de cancelaciones"]], who: ["cyshcn"] },

  { id: "wait", show: s => s.age !== "baby" && s.dx !== "yes", when: ["Don't wait for the diagnosis", "No espere el diagnóstico"], t: ["Start school help now", "Empiece la ayuda escolar ahora"],
    p: ["Your child can be evaluated for special education without any diagnosis. Send the school letter in the next steps while you wait for the doctor. When you get a diagnosis, give a copy to the school.", "Su hijo puede ser evaluado para educación especial sin ningún diagnóstico. Envíe la carta a la escuela de los próximos pasos mientras espera al médico. Cuando tenga un diagnóstico, dé una copia a la escuela."], who: ["includenyc"] },

  { id: "ei-transition", show: s => s.age === "baby", when: ["Around age 2½", "Cerca de los 2 años y medio"], t: ["Plan the move to preschool services", "Planee el paso a servicios preescolares"],
    p: ["Early Intervention usually ends at 3. Your service coordinator helps you refer to preschool special education (CPSE). Preschool services can start:", "Intervención Temprana normalmente termina a los 3 años. Su coordinador le ayuda a hacer el referido a educación especial preescolar (CPSE). Los servicios preescolares pueden empezar:"],
    list: [["Turns 3 between Jan 1 and Jun 30: preschool services can start Jan 2", "Cumple 3 entre el 1 de enero y el 30 de junio: los servicios pueden empezar el 2 de enero"], ["Turns 3 between Jul 1 and Dec 31: preschool services can start Jul 1", "Cumple 3 entre el 1 de julio y el 31 de diciembre: los servicios pueden empezar el 1 de julio"], ["If the CPSE finds your child eligible before age 3, you can choose to stay in Early Intervention until Sept 1 (birthday Jan–Aug) or Jan 2 (birthday Sept–Dec)", "Si el CPSE determina que su hijo es elegible antes de los 3 años, puede escoger quedarse en Intervención Temprana hasta el 1 de septiembre (cumpleaños de enero a agosto) o el 2 de enero (cumpleaños de septiembre a diciembre)"]], who: ["cpse"], letter: "cpse" },

  { id: "cpse", show: s => s.age === "pre", when: ["This week", "Esta semana"], t: ["Write to your district's CPSE", "Escriba al CPSE de su distrito"],
    p: ["Preschool special education referrals have to be in writing. Tap “Write this letter,” keep a copy, and send it to the CPSE. They'll mail you a packet with a consent form and a list of places that do evaluations.", "Los referidos de educación especial preescolar tienen que ser por escrito. Toque “Escribir esta carta”, guarde una copia y envíela al CPSE. Le enviarán un paquete con un formulario de consentimiento y una lista de lugares que hacen evaluaciones."],
    list: [["Call 311 to find which CPSE covers your district", "Llame al 311 para saber qué CPSE cubre su distrito"], ["Also apply to 3-K or pre-K. Families going through CPSE are encouraged to apply to inclusive programs", "Solicite también 3-K o pre-K. Se anima a las familias en el proceso del CPSE a solicitar programas inclusivos"]], who: ["cpse", "sehot", "includenyc"], letter: "cpse" },

  { id: "k", show: s => s.age === "pre", when: ["The year before kindergarten", "El año antes del kínder"], t: ["Get ready for the Turning 5 meeting", "Prepárese para la reunión de “Turning 5”"],
    p: ["Your child's IEP moves from the CPSE to the school system for kindergarten. Go to an INCLUDEnyc “Turning 5” workshop so you know what to ask for.", "El IEP de su hijo pasa del CPSE al sistema escolar para el kínder. Vaya a un taller de INCLUDEnyc sobre “Turning 5” para saber qué pedir."], who: ["includenyc"] },

  { id: "cse", show: s => s.age === "school" || s.age === "teen", when: ["This week", "Esta semana"], t: ["Ask the school, in writing, for an evaluation", "Pida a la escuela una evaluación por escrito"],
    p: ["Send a dated letter to the principal asking for a special education evaluation. After the evaluation there's an IEP meeting. You're a full member of that team, and you can bring someone with you.", "Envíe una carta con fecha al director pidiendo una evaluación de educación especial. Después de la evaluación hay una reunión del IEP. Usted es miembro pleno de ese equipo y puede traer a alguien con usted."],
    list: [["Already have an IEP? Ask for a meeting if services aren't working", "¿Ya tiene IEP? Pida una reunión si los servicios no están funcionando"], ["If the school says no or stalls, call AFC or INCLUDEnyc", "Si la escuela dice que no o se atrasa, llame a AFC o a INCLUDEnyc"]], who: ["cse", "sehot", "includenyc", "afc"], letter: "cse" },

  { id: "504", show: s => (s.age === "school" || s.age === "teen") && ["physical", "learning", "mental", "unsure"].includes(s.type), when: ["If an IEP isn't the right fit", "Si el IEP no es lo adecuado"], t: ["Ask about a 504 plan", "Pregunte por un plan 504"],
    p: ["Some kids don't need special teaching but do need changes to get through the school day: medication or nursing at school, extra test time, breaks, elevator access. That's a 504 plan. Ask the school's 504 coordinator for the request form and include the doctor's paperwork.", "Algunos niños no necesitan enseñanza especial pero sí cambios para pasar el día escolar: medicamentos o enfermería en la escuela, más tiempo en exámenes, descansos, uso del ascensor. Eso es un plan 504. Pida el formulario al coordinador 504 e incluya los papeles del médico."], who: ["s504"], letter: "504" },

  { id: "bus", show: s => s.age !== "baby", when: ["Before the IEP meeting", "Antes de la reunión del IEP"], t: ["Make sure transportation is on the IEP", "Asegúrese de que el transporte esté en el IEP"],
    p: ["If your child needs a school bus, it has to be written into the IEP, along with any needs like a lift, air conditioning, a smaller bus or a limit on ride time. The school will ask for medical forms.", "Si su hijo necesita autobús escolar, tiene que estar escrito en el IEP, junto con necesidades como un elevador, aire acondicionado, un autobús más pequeño o un límite de tiempo de viaje. La escuela le pedirá formularios médicos."], who: ["bus"] },

  { id: "sensory", show: s => s.type === "sensory", when: ["Before the IEP meeting", "Antes de la reunión del IEP"], t: ["Ask for vision or hearing services at school", "Pida servicios de visión o audición en la escuela"],
    p: ["NYC Public Schools has teams for blind and low vision students and for deaf and hard of hearing students. Ask for them in the IEP. For vision services, bring a report from an eye doctor. An eye doctor can also refer your child to the NYS Commission for the Blind.", "Las Escuelas Públicas de NYC tienen equipos para estudiantes ciegos o con baja visión y para estudiantes sordos o con pérdida auditiva. Pídalos en el IEP. Para servicios de visión, traiga un informe de un oftalmólogo. Un oftalmólogo también puede referir a su hijo a la Comisión para Ciegos del Estado."], who: ["sensory"] },

  { id: "mental", show: s => s.type === "mental", when: ["This week", "Esta semana"], t: ["Connect with mental health care", "Conéctese con atención de salud mental"],

function addDays(iso, n) { const [y, m, d] = iso.split("-").map(Number); const dt = new Date(y, m - 1, d + n); return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`; }
function renderCalc() {
  const date = document.getElementById("calc-date").value, kind = document.getElementById("calc-kind").value, out = document.getElementById("calc-out");
  if (!date) { out.innerHTML = `<span class="tip">${esc(t(UI.calcEmpty))}</span>`; return; }
  const rows = kind === "pre"
    ? [[UI.calcMeeting, addDays(date, 60)], [UI.calcServices, addDays(date, 84)]]
    : [[UI.calcEval, addDays(date, 60)], [UI.calcServices, addDays(date, 84)]];
  out.innerHTML = rows.map(([l, d]) => `<span class="due">${esc(t(l))} <b>${esc(fmtDate(d))}</b></span>`).join("") + `<span class="tip">${esc(t(UI.calcNote))}</span>`;
}
function renderRights() {
  const unit = u => u === "none" ? "" : u === "sch" ? t(UI.schoolDays) : u === "cal" ? t(UI.calDays) : (lang === "es" ? "días" : "days");
  const tl = arr => arr.map(([n, u, d]) => `<li><span class="days">${esc(n === "Now" && lang === "es" ? "Ya" : n)}<small>${esc(unit(u))}</small></span><span>${esc(t(d))}</span></li>`).join("");
  document.getElementById("tl-pre").innerHTML = tl(TL_PRE);
  document.getElementById("tl-sch").innerHTML = tl(TL_SCH);
  document.getElementById("rights").innerHTML = RIGHTS.map(([h, d]) => `<li><b>${esc(t(h))}</b><span>${esc(t(d))}</span></li>`).join("");
  document.getElementById("disagree").innerHTML = DISAGREE.map(([h, d]) => `<li><div class="step"><h3>${esc(t(h))}</h3><p>${esc(t(d))}</p></div></li>`).join("");
  const k = document.getElementById("calc-kind"), cur = k.value || (state.age === "pre" || state.age === "baby" ? "pre" : "sch");
  k.innerHTML = `<option value="pre">${esc(t(UI.tlPreH))}</option><option value="sch">${esc(t(UI.tlSchH))}</option>`;
  k.value = cur;
  renderCalc();
}
function planText() {
  const steps = STEPS.filter(s => s.show(state));
  const keys = [...new Set(steps.flatMap(s => s.who))];
  const contacts = keys.map(k => { const r = R[k]; const lines = (typeof r.lines === "function" ? r.lines() : r.lines).filter(([n]) => /\d{3}/.test(t(n))); return `• ${t(r.name)}${lines.length ? ": " + lines.map(([n, l]) => `${t(n)} (${t(l)})`).join(", ") : ""}\n  ${r.url}`; }).join("\n");
  return `${t(UI.planTitle)}\n${document.getElementById("path-sub").textContent.split(".")[0]}.\n\n` +
    steps.map((s, i) => `${done[s.id] ? "[x]" : "[ ]"} ${i + 1}. ${t(s.t)} (${t(s.when)})`).join("\n") +
    `\n\n${t(UI.kDir)}:\n${contacts}\n\n${t(UI.stuck)} INCLUDEnyc: (212) 677-4660`;
}

const SUBS = ["letters", "prep", "child", "log"];
const VIEWS = ["plan", "help", "tools", "rights", "words"];
let view = "plan", subview = "letters";
function go(name, opts = {}) {
  if (SUBS.includes(name)) { subview = name; name = "tools"; }
  if (!VIEWS.includes(name)) name = "plan";
  view = name;
  document.querySelectorAll(".view").forEach(v => v.hidden = v.dataset.view !== view);
  document.querySelectorAll(".tab").forEach(b => { const on = b.dataset.view === view; b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1; });
  document.querySelectorAll(".subview").forEach(v => v.hidden = v.dataset.sub !== subview);
  document.querySelectorAll("#subtabs .chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.sub === subview)));
  const hash = view === "tools" ? subview : view;
  if (location.hash.slice(1) !== hash) { try { history.replaceState(null, "", "#" + hash); } catch (e) { location.hash = hash; } }
  if (!opts.keepScroll) window.scrollTo(0, 0);
}

function copyText(txt, btn, okLabel) {

  const ok = () => { btn.textContent = okLabel || t(UI.copied); setTimeout(() => btn.textContent = restore, 1500); };
  const fail = () => { btn.textContent = t(UI.selected); setTimeout(() => btn.textContent = restore, 2500); };
  try { navigator.clipboard.writeText(txt).then(ok, fail); } catch (e) { fail(); }
}

document.addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (tab) { go(tab.dataset.view === "tools" ? subview : tab.dataset.view); return; }
  const st = e.target.closest("#subtabs .chip");
  if (st) { go(st.dataset.sub, { keepScroll: true }); return; }
  const lb = e.target.closest(".lang button");
  if (lb) { lang = lb.dataset.lang; save(); renderAll(); return; }
  const chip = e.target.closest(".chips[data-q] .chip");
  if (chip) { state[chip.parentElement.dataset.q] = chip.dataset.v; save(); renderPicker(); renderPath(); return; }
  const f = e.target.closest("#filters .chip");
  if (f) { cat = f.dataset.cat; renderDir(); return; }
  const res = e.target.closest("a[data-res]");
  if (res) {
    e.preventDefault();
    if (cat !== "path" && cat !== "all" && R[res.dataset.res].cat !== cat) cat = "path";
    go("help"); renderDir();
    const card = document.getElementById("res-" + res.dataset.res);
    if (card) { card.scrollIntoView({ block: "center" }); card.style.outline = "3px solid var(--sun)"; setTimeout(() => card.style.outline = "", 1600); }
    return;
  }
  if (res && cat !== "path" && cat !== "all" && R[res.dataset.res].cat !== cat) { cat = "path"; renderDir(); }
  const w = e.target.closest(".writeit");
  if (w) { document.getElementById("lt-type").value = w.dataset.letter; renderLetterForm(); go("letters"); document.getElementById("lt-parent").focus({ preventScroll: true }); return; }
  const c = e.target.closest(".copy");
  if (c) { const n = c.parentElement.querySelector(".num"); copyText(c.dataset.copy, c); const r = document.createRange(); r.selectNodeContents(n); const s = getSelection(); s.removeAllRanges(); s.addRange(r); return; }
  if (e.target.id === "lt-copy") {
    const out = document.getElementById("lt-out"); const r = document.createRange(); r.selectNodeContents(out); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    copyText(out.textContent, e.target); return;
  }
  if (e.target.id === "prep-copy") { copyText(prepText(), e.target); return; }
  if (e.target.id === "pf-copy") { copyText(profileText() || t(UI.pfEmpty), e.target); return; }
  if (e.target.id === "pf-clear") {
    if (e.target.dataset.armed) { profile = {}; try { localStorage.removeItem("cp-profile"); } catch (err) {} renderProfileForm(); e.target.textContent = t(UI.pfClear); delete e.target.dataset.armed; }
    else { e.target.dataset.armed = "1"; e.target.textContent = t(UI.pfClearConfirm); }
    return;
  }
  if (e.target.id === "copy-plan") { copyText(planText(), e.target); return; }
  if (e.target.id === "lg-copy") { copyText(logText() || t(UI.gEmpty), e.target); return; }
  const d = e.target.closest("[data-del]");
  if (d) {
    const ts = Number(d.dataset.del);
    if (pendingDelete === ts) { log = log.filter(x => x.ts !== ts); pendingDelete = null; saveLog(); }
    else pendingDelete = ts;
    renderLog();
  }
});
document.querySelector(".tabs").addEventListener("keydown", e => {
  if (!["ArrowLeft", "ArrowRight"].includes(e.key)) return;
  const tabs = [...document.querySelectorAll(".tab")]; const i = tabs.findIndex(b => b.dataset.view === view);
  const next = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
  go(next.dataset.view === "tools" ? subview : next.dataset.view); next.focus();
});
document.addEventListener("change", e => {
  if (e.target.matches(".donebox input")) { done[e.target.dataset.id] = e.target.checked; save(); renderPath(); }
  if (e.target.id === "lt-type") renderLetterForm();
  if (e.target.id === "calc-date" || e.target.id === "calc-kind") renderCalc();
  if (e.target.dataset.prep) { prepDone[e.target.dataset.prep] = e.target.checked; try { localStorage.setItem("cp-prep", JSON.stringify(prepDone)); } catch (err) {} }
});
document.querySelector("#letter-h").parentElement.addEventListener("input", e => { if (e.target.closest(".form")) document.getElementById("lt-out").textContent = buildLetter(); });
document.getElementById("pf-form").addEventListener("input", e => {
  if (!e.target.dataset.pf) return;
  profile[e.target.dataset.pf] = e.target.value;
  try { localStorage.setItem("cp-profile", JSON.stringify(profile)); } catch (err) {}
  renderProfileOut();
});
document.getElementById("log-form").addEventListener("submit", e => {
  e.preventDefault();
  const g = id => document.getElementById(id).value.trim();
  log.push({ ts: Date.now(), date: g("lg-date"), org: g("lg-org"), person: g("lg-person"), notes: g("lg-notes"), next: g("lg-next"), follow: g("lg-follow") });
  const ok = saveLog();
  ["lg-org", "lg-person", "lg-notes", "lg-next", "lg-follow"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("lg-status").textContent = t(ok ? UI.gSaved : UI.gNoStore);
  renderLog();
});
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
document.getElementById("lg-date").value = todayISO();
renderAll();
routeFromHash();
</script>
